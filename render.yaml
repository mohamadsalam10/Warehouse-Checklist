# Render Blueprint: creates the web app and its Postgres database, both on free plans.
# Render dashboard > New > Blueprint > pick this repository.
#
# Free plan limits:
#   - The free database is deleted 30 days after it's created. Upgrade it in Render, or move
#     to another server, before then. Each Render workspace can have one free database.
#   - The free web service sleeps after 15 minutes idle (first visit then takes about a minute).
#   - Email must go through Resend (RESEND_API_KEY): free web services block SMTP.
services:
  - type: web
    name: facility-check
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: facility-check-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false       # Render asks you for this during setup
databases:
  - name: facility-check-db
    plan: free
    databaseName: facility_check
