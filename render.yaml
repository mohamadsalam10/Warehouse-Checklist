# Render Blueprint: creates the web app and its Postgres database in one go.
# Render dashboard > New > Blueprint > pick this repository.
services:
  - type: web
    name: facility-check
    runtime: node
    plan: free            # free works with Resend; switch to starter if you want SMTP (free blocks SMTP ports)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: facility-check-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false       # Render asks you for this during setup
databases:
  - name: facility-check-db
    plan: basic-256mb     # paid (about $6/month). Render's free Postgres is deleted after 30 days.
    databaseName: facility_check
